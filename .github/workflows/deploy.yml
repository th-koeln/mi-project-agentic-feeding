name: Validieren und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys nicht parallel laufen lassen; der jeweils letzte Stand enthält alle Arbeiten
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # für updated_at aus der Git-Historie

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validieren
        run: npm run validate

      - name: Pages konfigurieren
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: index.json bauen
        run: npm run build
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}index.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
